name: Build iOS IPA (Free / Sideload)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Select newest Xcode & set DEVELOPER_DIR
        run: |
          echo "Available Xcode versions on runner:"
          ls -d /Applications/Xcode*.app
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting: $NEWEST_XCODE"
          sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
          DEV_DIR="$NEWEST_XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          export DEVELOPER_DIR="$DEV_DIR"
          xcodebuild -version
          swift --version

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🩹 Patch SwiftPM and ExpoModulesJSI toolchain compatibility
        run: |
          echo "Checking Swift version..."
          SWIFT_VER=$(swift --version | head -n 1)
          echo "$SWIFT_VER"
          # If Swift version is not 6.2+, patch Package.swift tools-version from 6.2 to 6.0
          find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} +
          # Remove -quiet flag in build-xcframework.sh so full compiler logs are visible
          find node_modules -name "build-xcframework.sh" -exec sed -i '' 's/-quiet//g' {} +

      - name: 🛠️ Expo Prebuild (Generate iOS native project)
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 CocoaPods Install
        working-directory: ios
        run: pod install

      - name: 🏗️ Build iOS App Binary (Unsigned)
        working-directory: ios
        run: |
          WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -json | grep -A 10 "schemes" | grep -v "schemes" | tr -d '", ' | head -n 1)
          echo "Using workspace: $WORKSPACE_NAME with scheme: $SCHEME_NAME"
          
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
              echo "::error::Xcode build failed! Here are the exact errors:"
              grep -E -C 2 "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log | tail -n 120
              exit 1
            }

      - name: 📦 Package into IPA (Payload format)
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build -name "*.app" -type d | head -n 1)
          echo "Found .app bundle at: $APP_DIR"
          cp -R "$APP_DIR" Payload/
          zip -r MAS-Player.ipa Payload
          mv MAS-Player.ipa ../MAS-Player.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAS-Player-iOS-IPA
          path: MAS-Player.ipa
          retention-days: 14
