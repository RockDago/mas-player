name: Build iOS IPA (Free / Sideload)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🛠️ Expo Prebuild (Generate iOS native project)
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 CocoaPods Install
        working-directory: ios
        run: pod install

      - name: 🏗️ Build iOS Archive (Unsigned)
        working-directory: ios
        run: |
          WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -json | grep -A 10 "schemes" | grep -v "schemes" | tr -d '", ' | head -n 1)
          echo "Using workspace: $WORKSPACE_NAME with scheme: $SCHEME_NAME"
          
          xcodebuild archive \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MASPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 Package into IPA (Payload format)
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/MASPlayer.xcarchive/Products/Applications/*.app Payload/
          zip -r MAS-Player.ipa Payload
          mv MAS-Player.ipa ../MAS-Player.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAS-Player-iOS-IPA
          path: MAS-Player.ipa
          retention-days: 14
