name: Build iOS IPA & Android APK (Free / Sideload)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 26.3 (Swift 6.2 — required by expo-modules-jsi tools-version)
        run: |
          echo "Available Xcode versions on runner:"
          ls -d /Applications/Xcode*.app
          # Xcode 26 needs macOS 15.5+, so this runner image is the floor.
          # expo-modules-jsi ships swift-tools-version 6.2 and SE-0439 trailing
          # commas in argument lists (Swift 6.1+); anything older fails to parse.
          # Newest-first, newest wins if several are absent. (macOS sort has no -V.)
          SELECTED=""
          for CANDIDATE in 26.3 26.2 26.1.1 26.0.1; do
            if [ -d "/Applications/Xcode_${CANDIDATE}.app" ]; then
              SELECTED="/Applications/Xcode_${CANDIDATE}.app"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "::error::No Xcode 26.x found on this runner image."
            exit 1
          fi
          echo "Selecting: $SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          DEV_DIR="$SELECTED/Contents/Developer"
          echo "DEVELOPER_DIR=$DEV_DIR" >> $GITHUB_ENV
          export DEVELOPER_DIR="$DEV_DIR"
          xcodebuild -version
          swift --version

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🩹 Patch ExpoModulesJSI and native equalizer
        run: |
          # Run robust JavaScript/C++ patcher covering all 7 pointer data race sites
          # and RuntimeScheduler.h constructor attributes
          node scripts/patch-expo-jsi.cjs

          # Reapply the Expo Audio native equalizer patches before generating Xcode.
          node scripts/patch-expo-audio-android.cjs

          # Prove the patch applied, on a pristine tree AND on a second pass.
          #
          # `String.replace` fails silently when its anchor moves, so a patch that
          # no longer matches reports success without having changed anything. That
          # is not hypothetical: the tap lifecycle fix sat behind an
          # `if (!includes('_dspState...'))` guard, so on an already-patched
          # node_modules — the common case — it was skipped in silence while the
          # script still printed its success line. The IPA then shipped the old,
          # crashing code.
          #
          # Exit 2 = patch correct, installed tree merely stale (`npm install`).
          # Exit 1 = patch itself is broken: fail here rather than ship an IPA
          # built from unpatched sources.
          node scripts/_patchselftest.cjs || [ $? -eq 2 ]

          # Drop -quiet so a Swift/C++ failure inside build-xcframework.sh is
          # visible in the job log instead of a bare "did not produce" error.
          find node_modules -name "build-xcframework.sh" -exec sed -i '' 's/-quiet//g' {} +

      - name: 🛠️ Expo Prebuild (Generate iOS native project)
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 CocoaPods Install
        working-directory: ios
        run: pod install

      - name: 🏗️ Build iOS App Binary (Unsigned)
        working-directory: ios
        run: |
          WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -json | grep -A 10 "schemes" | grep -v "schemes" | tr -d '", ' | head -n 1)
          echo "Using workspace: $WORKSPACE_NAME with scheme: $SCHEME_NAME"
          
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
              echo "::error::Xcode build failed! Here are the exact errors:"
              grep -E -C 2 "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log | tail -n 120
              exit 1
            }

      - name: 📦 Package into IPA (Payload format)
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build -name "*.app" -type d | head -n 1)
          echo "Found .app bundle at: $APP_DIR"
          cp -R "$APP_DIR" Payload/

          # 1. Signature ad-hoc de chaque framework dynamique imbriqué
          # Sans cela, les outils de sideload (Sideloadly, AltStore, Scarlet) risquent
          # de ne pas résigner les frameworks, causant un crash instantané dyld (Code signature invalid).
          find Payload -name "*.framework" -exec codesign --force --deep --sign - {} + 2>/dev/null || true
          codesign --force --deep --sign - "Payload/$(basename "$APP_DIR")" 2>/dev/null || true

          # 2. Empaquetage avec préservation stricte des liens symboliques (-y)
          # 'zip -r' sans '-y' écrase ou brise les symlinks des frameworks, rendant le binaire corrompu.
          zip -ry MAS-Player.ipa Payload
          mv MAS-Player.ipa ../MAS-Player.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAS-Player-iOS-IPA
          path: MAS-Player.ipa
          retention-days: 14

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🩹 Patch ExpoModulesJSI and native equalizer
        run: |
          # Meme sequence que le job iOS, et pour la meme raison : le job
          # Android ne s'appuyait que sur le `postinstall`. Ce hook est un
          # raccourci, pas une garantie — `npm ci` peut le sauter selon la
          # config npm, et rien ici ne verifiait que le patch avait abouti.
          # Un patch rate produit un APK construit sur des sources non corrigees,
          # sans le moindre signal dans les logs.
          node scripts/patch-expo-jsi.cjs
          node scripts/patch-expo-audio-android.cjs

          # Memes codes de sortie que ci-dessus : 2 = arbre installe simplement
          # anterieur (normal apres `npm ci`), 1 = patch casse, on echoue.
          node scripts/_patchselftest.cjs || [ $? -eq 2 ]

      - name: 📱 Accept Android SDK licenses & ensure Platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" || true

      - name: 🛠️ Expo Prebuild (Generate Android native project)
        run: npx expo prebuild --platform android --clean

      - name: 🐘 Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 📦 Locate and Package APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" MAS-Player.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAS-Player-Android-APK
          path: MAS-Player.apk
          retention-days: 14
