name: Build iOS IPA (Free / Sideload)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode >= 16.1
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | head -n 1)
            if [ -n "$XCODE_16" ]; then
              sudo xcode-select -s "$XCODE_16/Contents/Developer"
            fi
          fi
          echo "Selected Xcode version:"
          xcodebuild -version

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🛠️ Expo Prebuild (Generate iOS native project)
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 CocoaPods Install
        working-directory: ios
        run: pod install

      - name: 🏗️ Build iOS App Binary (Unsigned)
        working-directory: ios
        run: |
          WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -json | grep -A 10 "schemes" | grep -v "schemes" | tr -d '", ' | head -n 1)
          echo "Using workspace: $WORKSPACE_NAME with scheme: $SCHEME_NAME"
          
          xcodebuild build \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 📦 Package into IPA (Payload format)
        working-directory: ios
        run: |
          mkdir -p Payload
          APP_DIR=$(find ./build -name "*.app" -type d | head -n 1)
          echo "Found .app bundle at: $APP_DIR"
          cp -R "$APP_DIR" Payload/
          zip -r MAS-Player.ipa Payload
          mv MAS-Player.ipa ../MAS-Player.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAS-Player-iOS-IPA
          path: MAS-Player.ipa
          retention-days: 14
